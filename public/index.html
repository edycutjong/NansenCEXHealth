<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time CEX health monitoring dashboard powered by Nansen API — track exchange balances and 24hr net flows">
  <title>NansenCEXHealth — Exchange Health Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
</head>
<body>
  <header class="header">
    <div class="header__icon">🏦</div>
    <h1 class="header__title">CEX Health Monitor</h1>
    <p class="header__subtitle">Real-time exchange balance tracking & 24hr net flow analysis — powered by Nansen</p>
  </header>

  <div class="status-bar" id="statusBar">
    <span class="status-bar__dot status-bar__dot--loading" id="statusDot"></span>
    <span id="statusText">Loading exchange data...</span>
  </div>

  <main class="grid" id="grid">
    <!-- Cards injected by JS -->
  </main>

  <footer class="footer">
    Built by <a href="https://github.com/edycutjong" target="_blank">@edycutjong</a> · Powered by <a href="https://nansen.ai" target="_blank">Nansen API</a> · Auto-refreshes every 5 minutes
  </footer>

  <script src="/app.js"></script>
</body>
</html>
