<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time CEX health monitoring dashboard powered by Nansen API — track exchange balances and 24hr net flows">
  <title>NansenCEXHealth — Exchange Health Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%2322d3ee'/></linearGradient></defs><rect x='15' y='25' width='70' height='50' rx='8' fill='url(%23g)'/><rect x='30' y='40' width='40' height='5' rx='2' fill='%23fff' opacity='.4'/><rect x='30' y='52' width='25' height='5' rx='2' fill='%23fff' opacity='.25'/></svg>">
</head>
<body>
  <!-- Animated background mesh -->
  <div class="bg-mesh" aria-hidden="true">
    <div class="bg-mesh__orb bg-mesh__orb--1"></div>
    <div class="bg-mesh__orb bg-mesh__orb--2"></div>
    <div class="bg-mesh__orb bg-mesh__orb--3"></div>
  </div>

  <header class="header">
    <div class="header__icon">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <defs>
          <linearGradient id="vault-grad" x1="0" y1="0" x2="52" y2="52">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
          <filter id="vault-glow">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- Vault/Building icon -->
        <rect x="10" y="16" width="32" height="28" rx="4" fill="url(#vault-grad)" filter="url(#vault-glow)" opacity="0.9"/>
        <rect x="8" y="12" width="36" height="6" rx="3" fill="url(#vault-grad)" opacity="0.7"/>
        <rect x="16" y="22" width="20" height="3" rx="1.5" fill="#fff" opacity="0.3"/>
        <rect x="16" y="28" width="14" height="3" rx="1.5" fill="#fff" opacity="0.2"/>
        <circle cx="26" cy="37" r="3" fill="#fff" opacity="0.25"/>
      </svg>
    </div>
    <h1 class="header__title">CEX Health Monitor</h1>
    <p class="header__subtitle">Real-time exchange balance tracking & 24hr net flow analysis — powered by Nansen</p>
  </header>

  <div class="status-bar" id="statusBar">
    <span class="status-bar__dot status-bar__dot--loading" id="statusDot"></span>
    <span id="statusText">Loading exchange data...</span>
  </div>

  <main class="grid" id="grid">
    <!-- Cards injected by JS -->
  </main>

  <footer class="footer">
    <div class="footer__brand">
      <svg width="16" height="16" viewBox="0 0 52 52" fill="none"><rect x="10" y="16" width="32" height="28" rx="4" fill="#6366f1" opacity="0.5"/><rect x="8" y="12" width="36" height="6" rx="3" fill="#6366f1" opacity="0.4"/></svg>
      NansenCEXHealth
    </div>
    <div>Built by <a href="https://github.com/edycutjong" target="_blank">@edycutjong</a> · Powered by <a href="https://nansen.ai" target="_blank">Nansen API</a> · Auto-refreshes every 5 minutes</div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
